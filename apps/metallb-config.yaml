apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-config
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/dineshtolani/k8s-rook-ceph-gitops.git
    targetRevision: main
    path: infrastructure/metallb/config

  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system

  syncPolicy:
    automated:
      selfHeal: true
      prune: false

    syncOptions:
      - ServerSideApply=true
