apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-operator
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://charts.rook.io/release
    chart: rook-ceph
    targetRevision: 1.21.0
    helm:
      releaseName: rook-ceph

  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph

  syncPolicy:
    automated:
      selfHeal: true
      prune: false

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
